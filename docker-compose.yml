services:
  asistencia:
    image: node-asistencia
    container_name: node-asistencia
    build:
      context: .
    ports:
      - "3333:3333"
    env_file:
      - .env
    user: "node"
    networks:
      - redasistenciaAle

networks:
  redasistenciaAle:
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.31.0/24"
          gateway: "192.168.31.1"
